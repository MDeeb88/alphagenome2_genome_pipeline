name: alphagenome2

channels:
  - conda-forge
  - bioconda

dependencies:
  - python=3.11
  - pip

  # Core Python/data packages
  - numpy
  - pandas
  - pyyaml
  - tqdm

  # Genome FASTA access
  - pysam
  - samtools

  # NCBI genome download
  - ncbi-datasets-cli
  - unzip

  # Prediction storage
  - zarr=3.1.6
  - numcodecs=0.16.6

  # Genomic tracks
  - pybigwig

  # AlphaGenome is officially distributed through PyPI.
  - pip:
      - alphagenome==2.0.0
